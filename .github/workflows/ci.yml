name: CI for Node.js App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker-build:
    name: Build Docker Image (no push)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t my-node-app:test .

      - name: Save Docker image as a tar archive
        run: docker save -o "$RUNNER_TEMP/my-node-app.tar" my-node-app:test

      - name: Upload Docker image archive
        uses: actions/upload-artifact@v7
        with:
          name: my-node-app-image
          path: ${{ runner.temp }}/my-node-app.tar
          if-no-files-found: error
